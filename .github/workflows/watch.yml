name: watch

on:
  schedule:
    # Every 5 min,  24/7 (free on a public repo). No DST adjustment needed.
    - cron: "*/5 * * * *"
  push:
    branches: [probe]   # pushing to the "probe" branch runs a live probe (never pays)
  workflow_dispatch:
    inputs:
      mode:
        description: "alert = observe & notify | ping = send a test notification | probe = live dry run of checkout (never pays) | buy = single ticket"
        type: choice
        options: [alert, ping, probe, buy]
        default: alert
      probe_checkout:
        description: "probe mode: also dry-run the checkout (never pays)"
        type: boolean
        default: false
      probe_venue:
        description: "probe mode: venue tab to test with (needs an open session)"
        type: string
        default: "Brandeis"
      dry_run:
        description: "buy mode: stop before clicking Pay"
        type: boolean
        default: true
      targets:
        description: "any | today | space-separated dates like 11/20 12/04 (blank = repo default)"
        type: string
        default: ""
      screenshots:
        description: "buy mode: upload screenshots (PUBLIC repo: they may show your name/email)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # lets the bot prove to the prefs app that it's this repo (no shared secret)

concurrency:
  group: nyurban
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run bot
        env:
          NYU_PREFS_URL: ${{ vars.NYU_PREFS_URL }}
          NYU_PROBE_CHECKOUT: ${{ inputs.probe_checkout && '1' || '0' }}
          NYU_MODE: ${{ github.ref_name == 'probe' && 'probe' || inputs.mode || vars.NYU_MODE || 'alert' }}
          NYU_PROBE_VENUE: ${{ inputs.probe_venue || 'Brandeis' }}
          # probe runs write nothing back to the repo
          NYU_DATA_DIR: ${{ (inputs.mode == 'probe' || github.ref_name == 'probe') && runner.temp || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          SCREENSHOTS: ${{ github.event_name == 'workflow_dispatch' && inputs.screenshots && '1' || '0' }}
          NYU_TARGETS: ${{ inputs.targets || vars.NYU_TARGETS || 'any' }}
          NYU_LGA_URL: ${{ vars.NYU_LGA_URL }}
          NYU_BEACON_URL: ${{ vars.NYU_BEACON_URL }}
          NYU_NTFY_TOPIC: ${{ secrets.NYU_NTFY_TOPIC }}
          NYU_FIRST: ${{ secrets.NYU_FIRST }}
          NYU_LAST: ${{ secrets.NYU_LAST }}
          NYU_EMAIL: ${{ secrets.NYU_EMAIL }}
          NYU_USERNAME: ${{ secrets.NYU_USERNAME }}
          NYU_PASSWORD: ${{ secrets.NYU_PASSWORD }}
          NYU_CARD_NUMBER: ${{ secrets.NYU_CARD_NUMBER }}
          NYU_CARD_EXP: ${{ secrets.NYU_CARD_EXP }}
          NYU_CARD_CVV: ${{ secrets.NYU_CARD_CVV }}
          NYU_CARD_ZIP: ${{ secrets.NYU_CARD_ZIP }}
        run: python bot.py

      - name: Save state & sightings
        if: always()
        run: |
          git config user.name "nyurban-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json sightings.csv
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "bot: update state/sightings"
            for i in 1 2 3; do
              git pull --rebase --quiet && git push && break
              sleep 3
            done
          fi

      - name: Upload screenshots
        if: always() && github.event_name == 'workflow_dispatch' && inputs.screenshots
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
          retention-days: 1
          if-no-files-found: ignore
