<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Alerts admin</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --mute:#6b6b70; --line:#e4e2dc; --accent:#1f6f5c; --accent-ink:#fff; --warn:#a2471b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1e1e1f; --ink:#ececec; --mute:#9a9aa0; --line:#2e2e30; --accent:#4fb39a; --accent-ink:#0d1f1a; --warn:#e08a5c; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
  .name { font-weight:600; }
  .muted { color:var(--mute); font-size:14px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:8px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  button.danger { color:var(--warn); }
  input[type=text], input[type=password] { font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:transparent; color:inherit; flex:1; }
  form { display:flex; gap:8px; }
  form input { min-width:0; } form button { white-space:nowrap; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; text-align:center; }
  .stat b { display:block; font-size:22px; }
  .stat span { color:var(--mute); font-size:12px; }
  .meta { color:var(--mute); font-size:13px; margin-top:6px; }
  .flag { color:var(--warn); }
  .pop { font-size:14px; margin-top:12px; }
  .pop div { margin:3px 0; }
</style>
</head>
<body>
<main>
  <h1>Alerts admin</h1>
  <div class="card" id="login" hidden>
    <form id="loginform"><input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" required><button class="primary">Sign in</button></form>
    <p class="muted" id="loginmsg" style="margin:10px 0 0">Enter the ADMIN_TOKEN you set in Vercel.</p>
  </div>
  <div class="card" id="addcard" hidden>
    <form id="add"><input type="text" id="newname" placeholder="Name" maxlength="40" required><button class="primary">Add person</button></form>
    <p class="muted" style="margin:10px 0 0">Each person gets their own private link and ntfy topic. Send them the link.</p>
  </div>
  <div id="overview"></div>
  <div id="list"></div>
  <p style="margin-top:16px"><button id="signout" hidden>Sign out</button></p>
</main>
<script>
const store = { get: () => { try { return localStorage.getItem('nyu_admin'); } catch { return null; } },
  set: (v) => { try { localStorage.setItem('nyu_admin', v); } catch {} }, clear: () => { try { localStorage.removeItem('nyu_admin'); } catch {} } };
const qk = new URLSearchParams(location.search).get('k');
if (qk) { store.set(qk); history.replaceState(null, '', location.pathname); }
let k = qk || store.get();
function showLogin(msg) {
  document.getElementById('login').hidden = false; document.getElementById('addcard').hidden = true;
  document.getElementById('signout').hidden = true; document.getElementById('list').innerHTML = '';
  if (msg) document.getElementById('loginmsg').textContent = msg;
  document.getElementById('pw').focus();
}
document.getElementById('loginform').onsubmit = (e) => { e.preventDefault(); k = document.getElementById('pw').value.trim(); if (k) { store.set(k); load(); } };
document.getElementById('signout').onclick = () => { store.clear(); k = null; document.getElementById('overview').innerHTML = ''; showLogin('Signed out.'); };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const api = (body) => fetch(`/api/admin?k=${encodeURIComponent(k)}`, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
const ago = (iso) => { if (!iso) return null; const m = (Date.now() - Date.parse(iso)) / 60000;
  return m < 2 ? 'just now' : m < 60 ? `${Math.round(m)}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`; };
const day = (iso) => iso ? new Date(iso).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '?';
function overview(users) {
  const opened = users.filter((u) => u.lastSeen).length, paused = users.filter((u) => u.paused).length;
  const pushes = users.reduce((n, u) => n + u.alerts.pushes, 0);
  const tally = (f) => { const m = {}; users.filter((u) => !u.paused && u.rules.length).forEach((u) => f(u).forEach((x) => (m[x] = (m[x] || 0) + 1))); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const venues = tally((u) => u.rules.map((r) => r.venue));
  const levels = tally((u) => [...new Set([...(u.levels.length ? u.levels : ['Any level']), ...u.rules.flatMap((r) => r.levels)])]);
  return `<div class="card">
    <div class="stats">
      <div class="stat"><b>${users.length}</b><span>people</span></div>
      <div class="stat"><b>${opened}</b><span>opened link</span></div>
      <div class="stat"><b>${paused}</b><span>paused</span></div>
      <div class="stat"><b>${pushes}</b><span>pushes sent</span></div>
    </div>
    ${venues.length ? `<div class="pop"><div><span class="muted">Venues:</span> ${venues.map(([k, n]) => `${esc(k)} ${n}`).join(' · ')}</div>
      <div><span class="muted">Levels:</span> ${levels.map(([k, n]) => `${esc(k)} ${n}`).join(' · ')}</div></div>` : ''}
  </div>`;
}
const meta = (u) => [
  `Added ${day(u.created)}`,
  u.lastSeen ? `opened ${ago(u.lastSeen)} (${u.visits}×)` : '<span class="flag">hasn\'t opened link</span>',
  u.saves ? `saved ${u.saves}×` : null,
  u.alerts.pushes ? `${u.alerts.pushes} pushes, last ${ago(u.alerts.last)}` : 'no pushes yet',
].filter(Boolean).join(' · ');
const summary = (u) => u.paused ? 'Paused' : ((u.levels || []).length ? `${u.levels.join(', ')} · ` : '') + (u.rules.length ? u.rules.map((r) => r.venue + (r.levels.length ? ` (${r.levels.join(', ')})` : '')).join(' · ') : 'No venues picked yet') + (u.snooze.length ? ` · skipping ${u.snooze.join(', ')}` : '') + (u.maxFreq ? ` · max 1 push / ${u.maxFreq}m` : '');

async function load() {
  if (!k) return showLogin();
  document.getElementById('list').innerHTML = '<p class="muted">Loading…</p>';
  const r = await api();
  if (r.status === 401 || r.status === 403) { store.clear(); k = null; return showLogin('Wrong password. Try again.'); }
  if (!r.ok) { document.getElementById('list').innerHTML = '<p class="muted">Something went wrong (' + r.status + ').</p>'; return; }
  document.getElementById('login').hidden = true; document.getElementById('addcard').hidden = false; document.getElementById('signout').hidden = false;
  document.getElementById('pw').value = '';
  const { users } = await r.json();
  document.getElementById('overview').innerHTML = users.length ? overview(users) : '';
  document.getElementById('list').innerHTML = users.length ? users.map((u) => `
    <div class="card">
      <div class="name">${esc(u.name)}</div>
      <div class="muted">${esc(summary(u))}</div>
      <div class="meta">${meta(u)}</div>
      <div class="actions">
        <button data-copy="${esc(u.link)}">Copy link</button>
        <button data-open="${esc(u.link)}">Open</button>
        <button data-test="${esc(u.token)}">Send test</button>
        <button class="danger" data-del="${esc(u.token)}" data-name="${esc(u.name)}">Remove</button>
      </div>
    </div>`).join('') : '<p class="muted">No one yet.</p>';
  document.querySelectorAll('[data-copy]').forEach((b) => (b.onclick = async () => { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Copied'; }));
  document.querySelectorAll('[data-open]').forEach((b) => (b.onclick = () => window.open(b.dataset.open, '_blank')));
  document.querySelectorAll('[data-test]').forEach((b) => (b.onclick = async () => { const r = await api({ action: 'test', token: b.dataset.test }); b.textContent = r.ok ? 'Sent' : 'Failed'; }));
  document.querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
    if (!confirm(`Remove ${b.dataset.name}? Their link stops working.`)) return;
    await api({ action: 'delete', token: b.dataset.del }); load();
  }));
}
document.getElementById('add').onsubmit = async (e) => {
  e.preventDefault();
  const name = document.getElementById('newname').value.trim(); if (!name) return;
  await api({ action: 'create', name }); document.getElementById('newname').value = ''; load();
};
load();
</script>
</body>
</html>
